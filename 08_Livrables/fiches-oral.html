  var CARDS = [{"role": 1, "kind": "question", "front": "Pourquoi dites-vous que l'enveloppe est nette ?", "back": "Parce que la diapositive la présente comme une rotation nette et que les composantes publiées se recalculent : 1,0 Md€ de tuck-ins moins 0,5 Md€ de cessions donnent les 0,5 Md€ annoncés. Veolia applique la même convention aux investissements industriels.", "tag": "Rôle 1 — Périmètre et sources"}, {"role": 1, "kind": "question", "front": "Les 4 Md€ annoncés étaient-ils bruts ou nets des cessions ?", "back": "Nets : la diapositive d'allocation du capital parle de « net growth investments » pour les boosters. Le brut, Veolia l'appelle « rotation d'actifs » : 4 Md€ déjà faits, 8,5 Md€ au total avec Clean Earth et le plan de cessions.", "tag": "Rôle 1 — Périmètre et sources"}, {"role": 1, "kind": "question", "front": "Les 8 Md€ de rotation ne contredisent-ils pas les 0,5 Md€ par an ?", "back": "Non : les 8 Md€ sont un montant brut (achats et ventes additionnés) sur quatre ans, les 0,5 Md€ un solde annuel.", "tag": "Rôle 1 — Périmètre et sources"}, {"role": 1, "kind": "question", "front": "Comment avez-vous constitué le registre ?", "back": "À partir des documents publiés par Veolia (DEU, amendements, communiqués, présentations), une ligne par chiffre avec fichier, page, URL et date. Les opérations viennent des notes « Principales évolutions de périmètre » des comptes consolidés.", "tag": "Rôle 1 — Périmètre et sources"}, {"role": 1, "kind": "chiffre", "front": "GreenUp : investissements nets de croissance, boosters (2024-2027)", "back": "4 Md€ — en_master_greenup_strategy-day_v270324.pdf, p. 44 — pas encore relu", "tag": "F129 · rôle 1"}, {"role": 1, "kind": "chiffre", "front": "GreenUp : strongholds (2024-2027)", "back": "2 Md€ — en_master_greenup_strategy-day_v270324.pdf, p. 44 — pas encore relu", "tag": "F130 · rôle 1"}, {"role": 1, "kind": "chiffre", "front": "Investissements financiers nets des cessions (entrée) (FY2024)", "back": "397 M€ — pr-2024-ann 2026.pdf, p. 29 — pas encore relu", "tag": "F25 · rôle 1"}, {"role": 1, "kind": "chiffre", "front": "Clean Earth net du programme", "back": "0,78 Md EUR — 1,6 année d'enveloppe nette — pas encore relu", "tag": "calcul · rôle 1"}, {"role": 2, "kind": "question", "front": "Pourquoi ne pas citer 3,39x au 30 juin ?", "back": "Parce qu'il rapporte toute la dette de Clean Earth à un seul mois de son EBITDA, et une dette de juin, toujours plus haute, à un plafond qui se mesure en décembre. Corrigé des deux, on est à 3,17x.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Quel est le vrai plafond : 3x ou les agences ?", "back": "Les deux, à des dates différentes. Veolia s'engage à garder BBB / Baa1, et S&P abaisse la note sous 18 % de FFO / dette. Au pic de dette de 2026, ce seuil demande 5,2 Md€ de FFO pour 5,2 Md€ générés en 2025 : c'est 2026 qui est tendu, et c'est pour cela que les cessions sont annoncées dans les deux ans. Fin 2027, avec un FFO qui suit l'EBITDA, le ratio remonte à 20,8 % et c'est le 3x de Veolia qui limite la capacité (Veolia dans le modèle).", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "D'où vient l'écart de 5,7 Md€ entre la dette des agences et la dette publiée ?", "back": "De la réconciliation que Moody's publie : la dette brute est la même (29 518,0 M€), Moody's y ajoute pensions, titrisation, retraitements et la moitié des hybrides (2 050,0 M€), puis retient moins de trésorerie (9 475,0 contre 8 021 + 1 952 chez Veolia). Chaque poste est au registre avec sa page.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Les hybrides sont-ils de la dette ?", "back": "Pas pour Veolia ni en IFRS. Mais ils portent un coupon et une date de rappel : un lecteur prudent en compte une partie, et le plafond de 2027 n'est alors plus tenu (3,06x à 50 %).", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Y a-t-il un mur de refinancement avant 2027 ?", "back": "Non. 9 642 M€ de flux contractuels en 2026, dont 4 933 de billets de trésorerie qui se renouvellent, face à 15 911 M€ de liquidités : couvert 1,65x. Le mur agit sur le FFO, pas sur la dette : environ 74 M€ d'intérêts de plus par an quand les souches à bas coupon de 2027-2028 se refinancent au taux de 2025.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Les hybrides ont-ils une date ?", "back": "Oui, six (DEU p.429) : 4,1 Md€ en tout, coupon moyen 3,45 %. Une seule tombe avant fin 2027 : 500 M€ à 1,625 % en septembre 2026. La remplacer au coupon de la dernière émission (4,322 %) coûte 13 M€ de coupon par an ; ne pas la remplacer porte le levier fin 2027 à 2,87x. Le vrai sujet n'est pas le levier mais le prix du capital hybride, qui a presque triplé entre 2019 et 2025.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Où se place Veolia parmi ses pairs ?", "back": "Dans le tableau de Moody's (Exhibit 12, douze mois à juin 2025) : 20,3 % de FFO / dette nette pour Veolia, 20,3 % pour ACEA, 23,3 % pour Hera, tous trois Baa1 ; Suez, « Baa2 Negative », est à 11,4 %. L'écart avec Suez est de 8,9 % ; avec Hera, −3,0 %. Le seuil des « high teens » n'est pas une abstraction : c'est la zone où se trouve déjà le concurrent direct.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Comment reconstituez-vous le FFO de Moody's, qui ne publie pas sa formule ?", "back": "Depuis le tableau de flux du DEU (p.362-363) : capacité d'autofinancement avant BFR, moins impôts et intérêts payés, plus remboursements d'actifs financiers opérationnels et dividendes reçus : 5 157 M€ contre 5 160 publiés, écart −0,1 %. Même lecture en 2024 à moins de 2 % près : c'est un contrôle bloquant du classeur.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "question", "front": "Pourquoi votre fin 2026 est-il crédible ?", "back": "Il n'utilise que la guidance de croissance (+5 à +6 %), le second semestre 2025 reproduit et la moitié des cessions signées : il tombe à 3,02x, ce que Veolia annonce.", "tag": "Rôle 2 — La contrainte"}, {"role": 2, "kind": "chiffre", "front": "Dette financière nette (31/12/2024)", "back": "17 819 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F23 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "EBITDA (FY2024)", "back": "6 788 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F17 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Levier publié (FY2024)", "back": "2,63x — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F20 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Dette financière nette (31/12/2025)", "back": "19 657 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F8 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "EBITDA (FY2025)", "back": "7 050 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F3 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Levier publié (FY2025)", "back": "2,79x — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F16 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Levier recalculé 2025", "back": "2,79x — DFN / EBITDA — pas encore relu", "tag": "calcul · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Dette au 30/06/2026, Clean Earth inclus (30/06/2026)", "back": "24 548 M€ — veolia-amendement-deu-2025-s1-2026.pdf, p. 14 — pas encore relu", "tag": "F11 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "Dette au 30/06/2025 (30/06/2025)", "back": "20 764 M€ — veolia_finance_amendment_urd_2025.pdf, p. 26 — pas encore relu", "tag": "F71 · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "EBITDA glissant 12 mois au 30/06/2026", "back": "7 235 M EUR — 2025 − S1 2025 + S1 2026 — pas encore relu", "tag": "calcul · rôle 2"}, {"role": 2, "kind": "chiffre", "front": "① Levier mécanique", "back": "3,39x — toute la dette, un mois d'EBITDA de Clean Earth — pas encore relu", "tag": "calcul · rôle 2"}, {"role": 2, de l'EBITDA des déchets solides (1 566 M€) et 2,8 % du chiffre d'affaires du groupe, réparti sur 17 pays de plus de 500 M€ (DEU p.375). Les actifs existent ; la question est le rythme : depuis 2022, 14 cessions pour 1 585 M€, 113 M€ en moyenne — 2 Md€ en deux ans, c'est 5,3 années du rythme passé.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Quelle est l'hypothèse la plus fragile du modèle ?", "back": "La croissance organique de l'EBITDA (g26, g27), parce qu'elle est faite d'efficacité : 90 % de l'organique 2026 du modèle (388 M€), c'est le programme de 350 M€ par an de GreenUp. Un programme de coûts se tient ou ne se tient pas ; la sensibilité de Trajectoire (g26 bas, g27 bas) en donne la version douce, l'onglet Pont EBITDA §D la version dure : −529 M€ de marge si rien n'est livré.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Pourquoi croire la guidance ?", "back": "Parce que Veolia a tenu ses objectifs financiers depuis 2020 : 8 / 8 dans notre tableau (Impact 2023 : 6,5 Md€ d'EBITDA pour 4,7 à 4,9 visés ; guidance 2025 : +5 à +6 % d'EBITDA organique, réalisé +6,3 %). Les objectifs manqués sont non financiers (465 kt de plastiques pour 610 visés, mixité). C'est ce qui donne au scénario central plus de poids qu'au défavorable — sans effacer la dépendance à l'efficacité (Pont EBITDA §D).", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Et l'énergie, le dollar, les taux ?", "back": "Des entrées externes que le DEU chiffre : l'énergie et les recyclats ont coûté −30 M€ d'EBITDA en 2025 et −60 M€ au seul S1 2026 — une année comme ce semestre coûterait 360 M€ de marge sous 3x. La dette en dollars (2 455 M€) ajoute 246 M€ de dette si le dollar monte de 10 % ; la position nette à taux variable (−2 992 M€) coûte 30 M€ par point de taux. Aucune ne pèse autant que les cessions ou l'efficacité, mais elles s'additionnent (Sensibilité, bloc Macro).", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Votre fourchette est-elle une probabilité ?", "back": "Oui depuis l'onglet Distribution : chaque hypothèse est tirée dans une loi triangulaire entre ses bornes (le sommet à la base), un facteur « conjoncture » fait bouger ensemble croissance, cash-flow, cessions et multiples (poids 0,4, hypothèse du groupe). Sur 1 000 futurs : 100 % tiennent les deux plafonds, 0 % passent sous le seuil S&P fin 2026, 40 % atteignent 8 Md€ d'EBITDA. Les tirages sont fixés par une graine : le classeur redonne les mêmes nombres, et le simulateur web, qui lit les mêmes formules, aussi.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Et si les cessions glissent en 2028 ?", "back": "Sans rien encaisser du reste du programme en 2027, la marge tombe de 1 571 à 1 092 M€. C'est le premier facteur.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Pourquoi ne pas couper le dividende ?", "back": "GreenUp s'engage sur un dividende qui suit le bénéfice par action (p.66). Le modèle le traite comme un engagement ; chaque 100 M€ économisés vaudrait 100 M€ de marge.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "question", "front": "Pourquoi le multiple de cession compte-t-il ?", "back": "Chaque euro encaissé réduit la dette d'un euro mais retire 1/multiple d'EBITDA, soit trois fois plus de capacité : à 10x, 100 M€ de cessions ne libèrent que 70 M€ de marge.", "tag": "Rôle 3 — Capacité et sensibilité"}, {"role": 3, "kind": "chiffre", "front": "Cash-flow libre net (FY2024)", "back": "1 156 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F13 · rôle 3"}, {"role": 3, "kind": "chiffre", "front": "Cash-flow libre net (FY2025)", "back": "1 178 M€ — annual-resultats-2025.pdf, p. 1 — pas encore relu", "tag": "F29 · rôle 3"}, {"role": 3, "kind": "chiffre", "front": "Cash-flow libre net, S1 (S1 2025)", "back": "−451 M€ — "F470 · rôle 3"}, {"role": 3, "kind": "chiffre", "front": "Cessions réalisées 2022 → S1 2026 (deals.csv)", "back": "1 585 M EUR — 14 opérations, 113 M€ en moyenne, la plus grande 580 — pas encore relu", "tag": "calcul · rôle 3"}, {"role": 3, "kind": "chiffre", "front": "Rythme passé de cessions", "back": "374 M EUR / an — 2 Md€ demandent 5,3 ans à ce rythme, ou 18 opérations moyennes — pas encore relu", "tag": "calcul · rôle 3"}, {"role": 4, "kind": "question", "front": "D'où viennent exactement les 8 Md€ ?", "back": "De l'efficacité d'abord. GreenUp promet 350 M€ de gains par an : sur quatre ans, 93 % de l'écart entre 6,5 Md€ (2023) et 8 Md€. 2025 le confirme : 399 M€ d'efficacité pour ~428 M€ de croissance organique de l'EBITDA ; avec les 99 M€ de synergies Suez supplémentaires, les deux programmes dépassent la croissance organique. Le reste (volumes, prix, énergie) ne couvre pas l'inflation des coûts.", "tag": "Rôle 4 — L'écart et les comparables"}, {"role": 4, "kind": "question", "front": "Et si l'efficacité n'est pas livrée en 2026-2027 ?", "back": "Chaque euro d'efficacité manquant retire trois euros de capacité d'endettement et aucun cash-flow ne le compense. Sans aucun gain en 2026-2027, l'EBITDA 2027 perd 700 M€, le levier remonte à 3,07x et la marge sous 3x devient −529 M€. C'est la question à poser à Veolia : les 350 M€ par an sont-ils sécurisés, et par quoi ?", "tag": "Rôle 4 — L'écart et les comparables"}, {"role": 4, "kind": "question", "front": "Le booster est-il en retard ?", "back": "En volume, sur l'objectif initial, oui ; sur l'objectif révisé, non. En valeur, il n'est dans les clous que grâce à Clean Earth.", "tag": "Rôle 4 — L'écart et les comparables"}, {"role": 4, "kind": "question", "front": "Pourquoi Clean Harbors est-il le bon comparable ?", "back": "Même métier aux États-Unis, là où Clean Earth opère : 6 030,8 M$ de chiffre d'affaires, marge 19,4 %, comptes 10-K audités. Mais son EBITDA est « ajusté » selon sa définition, et il porte ses propres passifs environnementaux : comparer les marges demande la même base.", "tag": "Rôle 4 — L'écart et les comparables"}, {"role": 4, "kind": "question", "front": "L'objectif de 9 Mt est-il une révision à la baisse ?", "back": "Le chiffre baisse et le libellé perd « et polluants ». Le DEU ne l'explique pas : c'est une question à poser, pas à trancher.", "tag": "Rôle 4 — L'écart et les comparables"}, {"role": 4, "kind": "chiffre", "front": "Déchets dangereux traités (2024)", "back": "9 196 kt — finance_veolia_urd_2025_en.pdf, p. 226 — pas encore relu", "tag": "F33 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Déchets dangereux traités (2025)", "back": "9 181 kt — finance_veolia_urd_2025_en.pdf, p. 226 — pas encore relu", "tag": "F34 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Objectif 2027 actuel (2027)", "back": "9 Mt — finance_veolia_urd_2025_en.pdf, p. 226 — pas encore relu", "tag": "F35 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Objectif 2027 initial (2027)", "back": "10 Mt — en_master_greenup_strategy-day_v270324.pdf, p. 9 — pas encore relu", "tag": "F36 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Capacité en construction (en construction)", "back": "430 kt — veolia_clean_earth_investor_presentation.pdf, p. 9 — pas encore relu", "tag": "F63 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "CA pro forma avec Clean Earth (2025E)", "back": "5,2 Md€ — veolia_clean_earth_investor_presentation.pdf, p. 9 — pas encore relu", "tag": "F59 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "EBITDA pro forma (2025E)", "back": "0,9 Md€ — veolia_clean_earth_investor_presentation.pdf, p. 9 — pas encore relu", "tag": "F60 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Marge pro forma (2025E)", "back": "17 % — veolia_clean_earth_investor_presentation.pdf, p. 9 — pas encore relu", "tag": "F61 · rôle 4"}, {"role": 4, "kind": "chiffre", "front": "Ambition EBITDA, par an, plus de (2024-2027)", "back": "10 %/an — veolia_clean_earth_inve
